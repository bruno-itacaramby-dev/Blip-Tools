    <meta charset="UTF-8">

    <title>Clonar Bots - Blip Tools</title>
    <style>
        /* Reset e configurações básicas */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            line-height: 1.6;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
            position: relative;
        }

        .back-button {
            position: absolute;
            left: 0;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .back-button:hover {
            background: rgba(255,255,255,0.3);
            transform: translateY(-50%) scale(1.05);
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        /* Seções principais */
        .config-section,
        .results-section,
        .error-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: slideUp 0.5s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Títulos das seções */
        h2 {
            color: #4a5568;
            margin-bottom: 5px;
            font-size: 1.5rem;
            padding-bottom: 10px;
        }

        /* Formulário */
        .config-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-weight: 600;
            color: #4a5568;
            font-size: 0.95rem;
        }

        .form-group input {
            padding: 12px 16px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Botão principal */
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            min-height: 50px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner de loading */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Seção de erro */
        .error-section {
            background: #fed7d7;
            border: 1px solid #feb2b2;
        }

        .error-message h3 {
            color: #c53030;
            margin-bottom: 10px;
        }

        .error-message p {
            color: #742a2a;
        }

        /* Seção de progresso */
        .progress-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            animation: slideUp 0.5s ease-out;
        }

        .progress-info {
            background: #f7fafc;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }

        .progress-info p {
            font-weight: 600;
            color: #4a5568;
            margin-bottom: 5px;
        }

        .progress-info p:last-child {
            margin-bottom: 0;
        }

        .progress-bar-container {
            margin-bottom: 20px;
        }

        .progress-bar {
            width: 100%;
            height: 20px;
            background: #e2e8f0;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .clonagem-log {
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            background: #f7fafc;
        }

        .log-item {
            padding: 8px 0;
            border-bottom: 1px solid #e2e8f0;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .log-item:last-child {
            border-bottom: none;
        }

        .log-success {
            color: #38a169;
        }

        .log-error {
            color: #e53e3e;
        }

        .log-info {
            color: #3182ce;
        }

        /* Switch customizado */
        .switch-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px 24px;
            margin-bottom: 10px;
        }
        .switch-label {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 400;
            cursor: pointer;
            user-select: none;
        }
        .switch-input {
            display: none;
        }
        .switch-slider {
            width: 38px;
            height: 22px;
            background: #b0b8c1;
            border-radius: 22px;
            position: relative;
            transition: none;
        }
        .switch-slider::before {
            content: '';
            position: absolute;
            left: 3px;
            top: 3px;
            width: 16px;
            height: 16px;
            background: #fff;
            border-radius: 50%;
            transition: transform 0.3s;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08);
        }
        .switch-input:checked + .switch-slider {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .switch-input:checked + .switch-slider::before {
            transform: translateX(16px);
        }
        .switch-label span:last-child {
            margin-left: 6px;
        }
    </style>

<body>
    <div class="container">
        <header>
            <a href="../index.html" class="back-button">← Voltar</a>

        </header>

        <main>
            <!-- Formulário de configuração -->
            <section class="config-section">
                <h2>Bot de Origem</h2>
                <p style="color: #4a5568; font-size: 0.9rem; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px;">Bot que você vai EXTRAIR as informações</p>

                            type="text"

                        >
                        <div id="destinoBotIdInfo" style="color:#4a5568; font-size:0.92rem; margin-top:4px; font-weight:500;"></div>
                    </div>

                    <!-- Checkboxes de opções de clonagem -->
                    <div class="form-group" style="margin-bottom: 10px;">
                        <label style="font-weight: 600; color: #4a5568; margin-bottom: 5px;">O que clonar?</label>
                        <div class="switch-grid">
                            <label class="switch-label">
                                <input type="checkbox" id="cbFluxo" class="switch-input">

                            <label class="switch-label">
                                <input type="checkbox" id="cbAtendentes" class="switch-input">
                                <span class="switch-slider"></span>

                            <label class="switch-label">

                            <label class="switch-label">

    <script>
        // Elementos do DOM
        const configForm = document.getElementById('configForm');
        const destinoForm = document.getElementById('destinoForm');
        const contratoInput = document.getElementById('contrato');
        const authorizationInput = document.getElementById('authorization');
        const destinoContratoInput = document.getElementById('destinoContrato');
        const destinoAuthorizationInput = document.getElementById('destinoAuthorization');
        const errorSection = document.getElementById('errorSection');
        const errorText = document.getElementById('errorText');
        const progressSection = document.getElementById('progressSection');
        const progressStatus = document.getElementById('progressStatus');
        const progressStep = document.getElementById('progressStep');
        const progressBarFill = document.getElementById('progressBarFill');
        const clonagemLog = document.getElementById('clonagemLog');

        // Event Listeners
        configForm.addEventListener('submit', handleFormSubmit);
        destinoForm.addEventListener('submit', handleFormSubmit);


        // Função principal para lidar com o envio do formulário
        async function handleFormSubmit(event) {
            event.preventDefault();
            
            const contrato = contratoInput.value.trim();
            const authorization = authorizationInput.value.trim();
            const destinoContrato = destinoContratoInput.value.trim();
            const destinoAuthorization = destinoAuthorizationInput.value.trim();
            
            if (!contrato || !authorization || !destinoContrato || !destinoAuthorization) {
                showError('Por favor, preencha todos os campos obrigatórios.');
                return;
            }
            
            // Mostrar loading
            setLoadingState(true);
            hideMessages();
            showProgress();
            
            try {
                addLogItem('🚀 Iniciando processo de clonagem de bot...', 'info');
                updateProgress('Iniciando...', 'Preparando dados', 0);
                
                console.log('Iniciando clonagem de bot');
                console.log('Contrato origem:', contrato);
                console.log('Contrato destino:', destinoContrato);
                
                // Verificar switches
                const fluxoSwitch = document.getElementById('cbFluxo').checked;
                const filasSwitch = document.getElementById('cbFilas').checked;
                const regrasSwitch = document.getElementById('cbRegras').checked;
                const atendentesSwitch = document.getElementById('cbAtendentes').checked;
                const respostasSwitch = document.getElementById('cbRespostas').checked;
                const tagsSwitch = document.getElementById('cbTags').checked;
                const variaveisSwitch = document.getElementById('cbVariaveis').checked;
                const priorizacaoSwitch = document.getElementById('cbPriorizacao').checked;
                
                let progressStep = 0;
                const totalSteps = [fluxoSwitch, filasSwitch, regrasSwitch, atendentesSwitch, respostasSwitch, tagsSwitch, variaveisSwitch, priorizacaoSwitch].filter(Boolean).length;
                const progressIncrement = totalSteps > 0 ? 100 / totalSteps : 0;
                
                // 1. FLUXO (só se switch estiver ON)
                if (fluxoSwitch) {
                    updateProgress('Processando...', 'Obtendo e enviando fluxo do bot', progressStep);
                    const jsonFluxo = await getBotFlow(contrato, authorization);
                    addLogItem('✅ Fluxo do bot obtido com sucesso', 'success');
                    
                    await setBotFlow(destinoContrato, destinoAuthorization, jsonFluxo);
                    addLogItem('✅ Fluxo clonado com sucesso', 'success');
                    progressStep += progressIncrement;
                }
                
                // 2. FILAS
                if (filasSwitch) {
                    updateProgress('Processando...', 'Clonando filas de atendimento', progressStep);
                    await processarFilas(contrato, authorization, destinoContrato, destinoAuthorization);
                    progressStep += progressIncrement;
                }
                
                // 3. REGRAS DE ATENDIMENTO
                if (regrasSwitch) {
                    updateProgress('Processando...', 'Clonando regras de atendimento', progressStep);
                    await processarRegrasAtendimento(contrato, authorization, destinoContrato, destinoAuthorization);
                    progressStep += progressIncrement;
                }
                
                // 4. ATENDENTES
                if (atendentesSwitch) {
                    updateProgress('Processando...', 'Clonando atendentes', progressStep);
                    addLogItem('📥 Buscando atendentes...', 'info');
                    const atendentes = await getAtendentes(contrato, authorization);
                    
                    for (const atendente of atendentes) {
                        try {
                            await setAtendente(destinoContrato, destinoAuthorization, atendente);
                            await new Promise(resolve => setTimeout(resolve, 300));
                        } catch (error) {
                            addLogItem(`❌ Erro ao clonar atendente ${atendente.fullName}: ${error.message}`, 'error');
                        }
                    }
                    progressStep += progressIncrement;
                }
                
                // 5. RESPOSTAS PRONTAS
                if (respostasSwitch) {
                    updateProgress('Processando...', 'Clonando respostas prontas', progressStep);
                    await processarRespostasProntas(contrato, authorization, destinoContrato, destinoAuthorization);
                    progressStep += progressIncrement;
                }
                
                // 6. TAGS
                if (tagsSwitch) {
                    updateProgress('Processando...', 'Clonando tags', progressStep);
                    addLogItem('📥 Buscando tags...', 'info');
                    const tagsInfo = await getTags(contrato, authorization);
                    
                    addLogItem('📤 Clonando tags...', 'info');
                    await setTags(destinoContrato, destinoAuthorization, tagsInfo);
                    progressStep += progressIncrement;
                }
                
                // 7. VARIÁVEIS DE CONFIGURAÇÃO
                if (variaveisSwitch) {
                    updateProgress('Processando...', 'Clonando variáveis de configuração', progressStep);
                    addLogItem('📥 Buscando variáveis de configuração...', 'info');
                    const variaveis = await getVariaveisConfiguracao(contrato, authorization);
                    
                    addLogItem('📤 Clonando variáveis de configuração...', 'info');
                    await setVariaveisConfiguracao(destinoContrato, destinoAuthorization, variaveis);
                    progressStep += progressIncrement;
                }
                
                // 8. REGRAS DE PRIORIZAÇÃO
                if (priorizacaoSwitch) {
                    updateProgress('Processando...', 'Espelhando regras de priorização', progressStep);
                    await processarRegrasPriorizacao(contrato, authorization, destinoContrato, destinoAuthorization);
                    progressStep += progressIncrement;
                }

                // Sucesso!
                updateProgress('Concluído!', 'Clonagem finalizada com sucesso', 100);
                addLogItem('🎉 Clonagem concluída com sucesso!', 'success');
                addLogItem('✅ Todos os dados foram transferidos corretamente.', 'success');
                
            } catch (error) {
                console.error('Erro:', error);
                addLogItem(`❌ Erro: ${error.message}`, 'error');
                updateProgress('Erro!', 'Processo interrompido', 0);
                showError(error.message || 'Erro ao conectar com o servidor');
            } finally {
                setLoadingState(false);
            }
        }

        // Função para obter o fluxo do bot de origem
        async function getBotFlow(contrato, authorization) {
            const url = `https://${contrato}.http.msging.net/commands`;
            const guid = generateGuid();
            
            const requestBody = {
                "id": guid,
                "method": "get",
                "uri": "/buckets/blip_portal:builder_working_flow"
            };
            
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': authorization
            };
            
            console.log('Fazendo 1ª requisição GET para:', url);
            console.log('Request body:', requestBody);
            
            const response = await fetch(url, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                throw new Error(`Erro na requisição: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            console.log('Resposta da 1ª requisição:', data);
            
            if (data.status !== 'success') {
                throw new Error(`Erro na resposta: ${data.status}`);
            }
            
            if (!data.resource) {
                throw new Error('Resposta não contém o resource esperado');
            }
            
            return data.resource;
        }

        // Função para obter configurações globais do bot de origem
        async function getGlobalActions(contrato, authorization) {
            const url = `https://${contrato}.http.msging.net/commands`;
            const guid = generateGuid();
            
            const requestBody = {
                "id": guid,
                "method": "get",
                "uri": "/buckets/blip_portal:builder_working_global_actions"
            };
            
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': authorization
            };
            
            console.log('Fazendo 2ª requisição GET para:', url);
            console.log('Request body:', requestBody);
            
            const response = await fetch(url, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                throw new Error(`Erro na requisição: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            console.log('Resposta da 2ª requisição:', data);
            
            if (data.status !== 'success') {
                throw new Error(`Erro na resposta: ${data.status}`);
            }
            
            if (!data.resource) {
                throw new Error('Resposta não contém o resource esperado');
            }
            
            return data.resource;
        }

        // Função para obter configurações gerais do bot de origem
        async function getGeneralConfiguration(contrato, authorization) {
            const url = `https://${contrato}.http.msging.net/commands`;
            const guid = generateGuid();
            
            const requestBody = {
                "id": guid,
                "method": "get",
                "uri": "/buckets/blip_portal:builder_working_configuration"
            };
            
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': authorization
            };
            
            console.log('Fazendo 3ª requisição GET para:', url);
            console.log('Request body:', requestBody);
            
            const response = await fetch(url, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                throw new Error(`Erro na requisição: ${response.status} ${response.statusText}`);
            }
            
            const data = await response.json();
            console.log('Resposta da 3ª requisição:', data);
            
            if (data.status !== 'success') {
                throw new Error(`Erro na resposta: ${data.status}`);
            }
            
            if (!data.resource) {
                throw new Error('Resposta não contém o resource esperado');
            }
            
            return data.resource;
        }

        // Função para enviar fluxo para o bot de destino
        async function setBotFlow(contrato, authorization, jsonFluxo) {
            const url = `https://${contrato}.http.msging.net/commands`;
            const guid = generateGuid();
            
            const requestBody = {
                "id": guid,
                "method": "set",
                "uri": "/buckets/blip_portal:builder_working_flow",
                "type": "application/json",
                "resource": jsonFluxo
            };
            
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': authorization
            };
            
            console.log('Fazendo 1ª requisição SET para:', url);
            console.log('Request body:', requestBody);
            
            const response = await fetch(url, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(requestBody)
            });
            
            if (!response.ok) {
                throw new Error(`Erro na requisição SET: ${response.status} ${response.statusText}`);

        /* ==================================================================
           ESPELHAMENTO IDEMPOTENTE
           ------------------------------------------------------------------
           Rodar N vezes tem que dar sempre o mesmo resultado. Para isso a
           comparação nunca pode incluir campos que o servidor gera (id,
           ownerIdentity, storageDate, priority, queueId) nem campos que a
           gente manda no set mas que o get não devolve (conditions[].id,
           extrasProperty, errorExtras, errorValues). Se qualquer um deles
           entrar na assinatura, toda regra parece diferente e acaba sendo
           reescrita em toda rodada.
           ================================================================== */

        const DESK = 'postmaster@desk.msging.net';
        // O $take PRECISA do cifrão. Sem ele a Blip ignora o parâmetro em
        // silêncio e devolve só os 100 primeiros itens.
        const PAGE_SIZE = 500;
        const WRITE_DELAY = 120;

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        // Envia um comando LIME e devolve o envelope de resposta cru.
        async function deskCommand(contrato, authorization, body) {
            const response = await fetch(`https://${contrato}.http.msging.net/commands`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': authorization },
                body: JSON.stringify(Object.assign({ id: generateGuid() }, body))
            });
            if (!response.ok) {
                throw new Error(`HTTP ${response.status} ${response.statusText}`);
            }
            return await response.json();
        }

        function reasonOf(data) {
            return (data && data.reason && data.reason.description) || (data && data.status) || 'erro desconhecido';
        }

        // A Blip responde "resource not found" (code 67) quando o bot nunca
        // usou aquele recurso. Isso significa zero itens, não erro.
        function isEmptyResource(data) {
            if (!data || data.status !== 'failure') return false;
            const code = data.reason && data.reason.code;
            const desc = (data.reason && data.reason.description) || '';
            return code === 67 || /not found/i.test(desc);
        }

        // Lê uma coleção do Desk inteira. Se não conseguir ler tudo, aborta:
        // um espelho calculado em cima de leitura parcial apagaria dados bons
        // do destino.
        async function deskGetAll(contrato, authorization, uri) {
            const items = [];
            let skip = 0;
            let total = null;

            for (let pagina = 0; pagina < 50; pagina++) {
                const sep = uri.indexOf('?') === -1 ? '?' : '&';
                const data = await deskCommand(contrato, authorization, {
                    to: DESK,
                    method: 'get',
                    uri: `${uri}${sep}$skip=${skip}&$take=${PAGE_SIZE}`
                });

                if (isEmptyResource(data)) return [];
                if (data.status !== 'success') throw new Error(`${uri}: ${reasonOf(data)}`);

                const page = (data.resource && data.resource.items) || [];
                if (total === null) {
                    total = (data.resource && typeof data.resource.total === 'number')
                        ? data.resource.total
                        : page.length;
                }
                items.push.apply(items, page);
                if (page.length === 0 || items.length >= total) break;
                skip += PAGE_SIZE;
            }

            if (total !== null && items.length !== total) {
                throw new Error(`${uri}: leitura incompleta (${items.length} de ${total}) - abortado para não apagar dados por engano`);
            }
            return items;
        }

        // Descobre o identity do bot autenticado pelo campo "to" de qualquer
        // resposta. Não usa o DOM de propósito: o #destinoBotIdInfo é
        // preenchido por um setTimeout com debounce e pode estar vazio na
        // hora do submit.
        async function getBotIdentity(contrato, authorization) {
            const data = await deskCommand(contrato, authorization, { to: DESK, method: 'get', uri: '/replies' });
            if (!data.to || typeof data.to !== 'string') {
                throw new Error('não foi possível identificar o bot (confira o contrato e o Authorization)');
            }
            return data.to.split('/')[0].split('@')[0] + '@msging.net';
        }

        // Normalização usada SÓ nas dimensões que a ferramenta se recusa a
        // reescrever (nome de fila). Título e conteúdo são comparados exatos,
        // senão o espelho nunca corrigiria uma diferença de caixa no destino.
        function normalizeName(valor) {
            return String(valor == null ? '' : valor)
                .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                .trim().toLowerCase().replace(/\s+/g, ' ');
        }

        // Formato canônico das condições, só para comparar. O values é um
        // conjunto (OR), então a ordem não é semântica: ordenar evita
        // reescrever a regra à toa caso o servidor devolva em outra ordem.
        function canonConditions(conditions) {
            const lista = (Array.isArray(conditions) ? conditions : []).map(c => {
                const values = (Array.isArray(c.values) ? c.values : []).map(v => String(v));
                values.sort();
                return {
                    property: String(c.property || ''),
                    relation: String(c.relation || ''),
                    values: values
                };
            });
            lista.sort((a, b) => {
                const sa = JSON.stringify(a), sb = JSON.stringify(b);
                return sa < sb ? -1 : (sa > sb ? 1 : 0);
            });
            return lista;
        }

        // Diff de multiset: agrupa origem e destino por assinatura e casa por
        // contagem. O que sobra na origem vira criação, o que sobra no destino
        // vira remoção, empate não mexe. Como é por contagem, título repetido
        // não faz o resultado oscilar entre uma rodada e outra.
        function diffBySignature(itensOrigem, itensDestino, sigOrigem, sigDestino) {
            const porSigOrigem = new Map();
            const porSigDestino = new Map();

            itensOrigem.forEach(item => {
                const s = sigOrigem(item);
                if (!porSigOrigem.has(s)) porSigOrigem.set(s, []);
                porSigOrigem.get(s).push(item);
            });
            itensDestino.forEach(item => {
                const s = sigDestino(item);
                if (!porSigDestino.has(s)) porSigDestino.set(s, []);
                porSigDestino.get(s).push(item);
            });

            const criar = [], deletar = [];
            let iguais = 0;

            new Set([...porSigOrigem.keys(), ...porSigDestino.keys()]).forEach(s => {
                const origem = porSigOrigem.get(s) || [];
                // ordena por id para a escolha de quem sobra ser reproduzível
                const destino = (porSigDestino.get(s) || []).slice()
                    .sort((a, b) => String(a.id) < String(b.id) ? -1 : 1);

                iguais += Math.min(origem.length, destino.length);
                if (origem.length > destino.length) criar.push.apply(criar, origem.slice(destino.length));
                if (destino.length > origem.length) deletar.push.apply(deletar, destino.slice(origem.length));
            });

            return { criar, deletar, iguais };
        }

        // Casa uma criação com uma remoção que são a mesma regra, só que
        // alterada, e transforma o par num update. Assim o destino é corrigido
        // no lugar em vez de perder o id da regra. O pareamento usa a chave
        // normalizada (tolerante) enquanto a assinatura usa o valor exato
        // (precisa) — é essa separação que permite o espelho corrigir o texto
        // do título no destino.
        function pairIntoUpdates(criar, deletar, chaveOrigem, chaveDestino) {
            const porChave = new Map();
            deletar.forEach(item => {
                const k = chaveDestino(item);
                if (!porChave.has(k)) porChave.set(k, []);
                porChave.get(k).push(item);
            });
            porChave.forEach(lista => lista.sort((a, b) => String(a.id) < String(b.id) ? -1 : 1));

            const atualizar = [], criarRestante = [], usados = new Set();

            criar.slice()
                .sort((a, b) => {
                    const ka = chaveOrigem(a), kb = chaveOrigem(b);
                    return ka < kb ? -1 : (ka > kb ? 1 : 0);
                })
                .forEach(item => {
                    const candidatos = porChave.get(chaveOrigem(item)) || [];
                    const alvo = candidatos.find(d => !usados.has(d.id));
                    if (alvo) {
                        usados.add(alvo.id);
                        atualizar.push({ origem: item, destino: alvo });
                    } else {
                        criarRestante.push(item);
                    }
                });

            return {
                atualizar,
                criar: criarRestante,
                deletar: deletar.filter(d => !usados.has(d.id))
            };
        }

        /* ---------------- Filas ---------------- */

        // Monta o mapa nome-normalizado -> fila. Colisão de normalização é
        // corrupção silenciosa em potencial (a regra iria parar na fila
        // errada), então prefere abortar.
        function buildQueueMap(filas, rotulo) {
            const mapa = new Map();
            filas.forEach(fila => {
                const chave = normalizeName(fila.name);
                if (mapa.has(chave)) {
                    throw new Error(`o bot de ${rotulo} tem duas filas que se confundem: "${mapa.get(chave).name}" e "${fila.name}"`);
                }
                mapa.set(chave, fila);
            });
            return mapa;
        }

        // Cria no destino só as filas que faltam. Fila que já existe nunca é
        // recriada, e fila nenhuma é apagada: excluir fila é destrutivo em
        // cascata (desvincula atendentes e apaga as regras associadas).
        async function ensureQueues(destinoContrato, destinoAuthorization, ownerDestino, filasNecessarias, mapaDestino) {
            let criadas = 0;

            for (const fila of filasNecessarias) {
                if (mapaDestino.has(normalizeName(fila.name))) continue;

                const data = await deskCommand(destinoContrato, destinoAuthorization, {
                    to: DESK,
                    method: 'set',
                    uri: '/attendance-queues',
                    type: 'application/vnd.iris.desk.attendancequeue+json',
                    resource: {
                        name: fila.name,
                        isActive: fila.isActive !== false,
                        ownerIdentity: ownerDestino,
                        Priority: fila.Priority || 0
                    }
                });

                if (data.status !== 'success') {
                    throw new Error(`falha ao criar a fila "${fila.name}": ${reasonOf(data)}`);
                }
                criadas++;
                addLogItem(`✅ Fila criada no destino: ${fila.name}`, 'success');
                await sleep(WRITE_DELAY);
            }

            return criadas;
        }

        /* ---------------- Regras de priorização ---------------- */

        // A fila entra normalizada (não reescrevemos fila); título e conteúdo
        // entram exatos, para o espelho conseguir corrigi-los no destino.
        function priorityRuleSignature(regra, queueName) {
            return JSON.stringify([
                normalizeName(queueName),
                String(regra.title == null ? '' : regra.title),
                !!regra.isActive,
                Number(regra.urgency) || 0,
                regra.applyConditions !== false,
                String(regra.operator || 'Or'),
                canonConditions(regra.conditions)
            ]);
        }

        // Reconstrói as condições no formato que o set espera. O
        // extrasProperty é omitido quando a propriedade não é um extra:
        // mandar "" pode reprovar na validação ou fazer o portal desenhar um
        // seletor de campo customizado vazio.
        function buildConditionsForSet(conditions) {
            return (Array.isArray(conditions) ? conditions : []).map(c => {
                const condicao = {
                    id: generateGuid(),
                    property: String(c.property || ''),
                    relation: String(c.relation || ''),
                    values: (Array.isArray(c.values) ? c.values : []).map(v => String(v)),
                    errorExtras: 'false',
                    errorValues: 'false'
                };
                const prefixo = 'Contact.Extras.';
                if (condicao.property.indexOf(prefixo) === 0) {
                    condicao.extrasProperty = condicao.property.substring(prefixo.length);
                }
                return condicao;
            });
        }

        // id vazio cria, id preenchido atualiza aquela regra.
        function buildPriorityRulePayload(regra, queueIdDestino, idDestino) {
            return {
                id: idDestino || '',
                queueId: queueIdDestino,
                isActive: !!regra.isActive,
                urgency: Number(regra.urgency) || 0,
                applyConditions: regra.applyConditions !== false,
                title: String(regra.title == null ? '' : regra.title),
                conditions: buildConditionsForSet(regra.conditions),
                operator: String(regra.operator || 'Or')
            };
        }

        async function processarRegrasPriorizacao(contrato, authorization, destinoContrato, destinoAuthorization) {
            addLogItem('📥 Lendo filas e regras de priorização dos dois bots...', 'info');

            // Primeira coisa: identificar os dois bots. Se o Authorization
            // estiver errado, falha aqui, antes de qualquer escrita.
            const ownerOrigem = await getBotIdentity(contrato, authorization);
            const ownerDestino = await getBotIdentity(destinoContrato, destinoAuthorization);
            if (ownerOrigem === ownerDestino) {
                throw new Error('origem e destino são o mesmo bot - clonagem cancelada');
            }

            const filasOrigem = await deskGetAll(contrato, authorization, '/attendance-queues');
            let filasDestino = await deskGetAll(destinoContrato, destinoAuthorization, '/attendance-queues');
            buildQueueMap(filasOrigem, 'origem');
            let mapaDestino = buildQueueMap(filasDestino, 'destino');
            const filaOrigemPorId = new Map(filasOrigem.map(f => [f.id, f]));

            const regrasOrigem = await deskGetAll(contrato, authorization, '/priority-rules');
            const regrasDestino = await deskGetAll(destinoContrato, destinoAuthorization, '/priority-rules');
            addLogItem(`✅ Origem: ${regrasOrigem.length} regra(s) de priorização | Destino: ${regrasDestino.length}`, 'info');

            // Regra cuja fila já não existe mais na origem não tem nome para
            // resolver, então fica de fora do diff.
            const regrasValidas = [];
            regrasOrigem.forEach(regra => {
                if (filaOrigemPorId.has(regra.queueId)) {
                    regrasValidas.push(regra);
                } else {
                    addLogItem(`⏭️ Regra "${regra.title}" ignorada: a fila dela não existe mais na origem`, 'info');
                }
            });

            // Cria só as filas que as regras realmente precisam.
            const filasNecessarias = [];
            const jaVistas = new Set();
            regrasValidas.forEach(regra => {
                const fila = filaOrigemPorId.get(regra.queueId);
                const chave = normalizeName(fila.name);
                if (!jaVistas.has(chave)) {
                    jaVistas.add(chave);
                    filasNecessarias.push(fila);
                }
            });

            const filasCriadas = await ensureQueues(destinoContrato, destinoAuthorization, ownerDestino, filasNecessarias, mapaDestino);
            if (filasCriadas > 0) {
                filasDestino = await deskGetAll(destinoContrato, destinoAuthorization, '/attendance-queues');
                mapaDestino = buildQueueMap(filasDestino, 'destino');
            }
            const filaDestinoPorId = new Map(filasDestino.map(f => [f.id, f]));

            const nomeFilaOrigem = regra => (filaOrigemPorId.get(regra.queueId) || {}).name || '';
            const nomeFilaDestino = regra => (filaDestinoPorId.get(regra.queueId) || {}).name || '';

            const diff = diffBySignature(
                regrasValidas,
                regrasDestino,
                regra => priorityRuleSignature(regra, nomeFilaOrigem(regra)),
                regra => priorityRuleSignature(regra, nomeFilaDestino(regra))
            );
            const plano = pairIntoUpdates(
                diff.criar,
                diff.deletar,
                regra => normalizeName(nomeFilaOrigem(regra)) + '||' + normalizeName(regra.title),
                regra => normalizeName(nomeFilaDestino(regra)) + '||' + normalizeName(regra.title)
            );

            if (regrasValidas.length === 0 && plano.deletar.length > 0) {
                addLogItem(`⚠️ A origem não tem regras de priorização: as ${plano.deletar.length} do destino serão removidas`, 'error');
            }
            // Rede de segurança: dá para recuperar o estado anterior pelo DevTools.
            console.log('Snapshot das regras de priorização do destino, antes das mudanças:', JSON.stringify(regrasDestino));

            let removidas = 0, atualizadas = 0, criadas = 0;

            // Ordem delete -> update -> create: compacta a lista antes de
            // inserir, então a ordem final no destino acompanha a da origem.
            for (const regra of plano.deletar) {
                const data = await deskCommand(destinoContrato, destinoAuthorization, {
                    to: DESK, method: 'delete', uri: `/priority-rules/${regra.id}`
                });
                if (data.status === 'success') {
                    removidas++;
                    addLogItem(`🗑️ Regra removida do destino: ${regra.title}`, 'info');
                } else {
                    addLogItem(`❌ Erro ao remover a regra "${regra.title}": ${reasonOf(data)}`, 'error');
                    showError(`Erro ao remover a regra "${regra.title}": ${reasonOf(data)}`);
                }
                await sleep(WRITE_DELAY);
            }

            const gravar = async (regraOrigem, idDestino, verbo) => {
                const fila = mapaDestino.get(normalizeName(nomeFilaOrigem(regraOrigem)));
                if (!fila) {
                    addLogItem(`❌ Regra "${regraOrigem.title}" ignorada: fila "${nomeFilaOrigem(regraOrigem)}" não encontrada no destino`, 'error');
                    return false;
                }
                const data = await deskCommand(destinoContrato, destinoAuthorization, {
                    to: DESK,
                    method: 'set',
                    uri: '/priority-rules',
                    type: 'application/vnd.iris.desk.priority-rules+json',
                    resource: buildPriorityRulePayload(regraOrigem, fila.id, idDestino)
                });
                if (data.status !== 'success') {
                    addLogItem(`❌ Erro ao ${verbo} a regra "${regraOrigem.title}": ${reasonOf(data)}`, 'error');
                    showError(`Erro ao ${verbo} a regra "${regraOrigem.title}": ${reasonOf(data)}`);
                    return false;
                }
                await sleep(WRITE_DELAY);
                return true;
            };

            for (const par of plano.atualizar) {
                if (await gravar(par.origem, par.destino.id, 'atualizar')) {
                    atualizadas++;
                    addLogItem(`📤 Regra atualizada no destino: ${par.origem.title}`, 'success');
                }
            }

            for (const regra of plano.criar) {
                if (await gravar(regra, '', 'criar')) {
                    criadas++;
                    addLogItem(`📤 Regra criada no destino: ${regra.title}`, 'success');
                }
            }

            addLogItem(`✅ Priorização: ${criadas} criada(s), ${atualizadas} atualizada(s), ${diff.iguais} já idêntica(s), ${removidas} removida(s)`, 'success');

            // Confere o espelho de fato, em vez de só torcer para ter dado certo.
            await verificarEspelhoPriorizacao(contrato, authorization, destinoContrato, destinoAuthorization, regrasValidas, nomeFilaOrigem);
        }

        // Relê o destino e compara o multiset de assinaturas com o da origem.
        // É o que pega, por exemplo, um update que na verdade criou.
        async function verificarEspelhoPriorizacao(contrato, authorization, destinoContrato, destinoAuthorization, regrasOrigem, nomeFilaOrigem) {
            try {
                const filasDestino = await deskGetAll(destinoContrato, destinoAuthorization, '/attendance-queues');
                const filaDestinoPorId = new Map(filasDestino.map(f => [f.id, f]));
                const regrasDestino = await deskGetAll(destinoContrato, destinoAuthorization, '/priority-rules');

                const conta = (lista, nomeDe) => {
                    const mapa = new Map();
                    lista.forEach(regra => {
                        const s = priorityRuleSignature(regra, nomeDe(regra));
                        mapa.set(s, (mapa.get(s) || 0) + 1);
                    });
                    return mapa;
                };

                const esperado = conta(regrasOrigem, nomeFilaOrigem);
                const obtido = conta(regrasDestino, regra => (filaDestinoPorId.get(regra.queueId) || {}).name || '');

                let divergencias = 0;
                new Set([...esperado.keys(), ...obtido.keys()]).forEach(s => {
                    divergencias += Math.abs((esperado.get(s) || 0) - (obtido.get(s) || 0));
                });

                if (divergencias === 0) {
                    addLogItem(`✅ Espelho verificado: ${regrasDestino.length} regra(s) de priorização idênticas à origem`, 'success');
                } else {
                    addLogItem(`⚠️ Espelho com ${divergencias} divergência(s) residual(is) - rode de novo para conferir`, 'error');
                    showError(`Espelho de priorização com ${divergencias} divergência(s) residual(is).`);
                }
            } catch (error) {
                addLogItem(`⚠️ Não foi possível verificar o espelho: ${error.message}`, 'error');
            }
        }

        /* ---------------- Filas de atendimento ---------------- */

        // Cria no destino as filas que faltam e não mexe no resto. Fila que já
        // existe nunca é recriada nem apagada — excluir fila é destrutivo em
        // cascata (desvincula atendentes e apaga as regras associadas).
        async function processarFilas(contrato, authorization, destinoContrato, destinoAuthorization) {
            const ownerDestino = await getBotIdentity(destinoContrato, destinoAuthorization);

            addLogItem('📥 Buscando filas de atendimento do bot de origem...', 'info');
            const filasOrigem = await deskGetAll(contrato, authorization, '/attendance-queues');
            const filasDestino = await deskGetAll(destinoContrato, destinoAuthorization, '/attendance-queues');
            addLogItem(`✅ Origem: ${filasOrigem.length} fila(s) | Destino: ${filasDestino.length}`, 'info');

            const mapaDestino = buildQueueMap(filasDestino, 'destino');
            let criadas = 0, mantidas = 0;

            for (const fila of filasOrigem) {
                const existente = mapaDestino.get(normalizeName(fila.name));

                if (existente) {
                    mantidas++;
                    // Divergência é só reportada: alterar uma fila em uso é
                    // decisão do operador, não da ferramenta.
                    const ativoDiferente = (existente.isActive !== false) !== (fila.isActive !== false);
                    const prioridadeDiferente = (existente.Priority || 0) !== (fila.Priority || 0);
                    if (ativoDiferente || prioridadeDiferente) {
                        addLogItem(`⏭️ Fila "${fila.name}" já existe (mantida) - atenção: isActive/Priority diferem da origem`, 'info');
                    } else {
                        addLogItem(`⏭️ Fila "${fila.name}" já existe - mantida`, 'info');
                    }
                    continue;
                }

                const data = await deskCommand(destinoContrato, destinoAuthorization, {
                    to: DESK,
                    method: 'set',
                    uri: '/attendance-queues',
                    type: 'application/vnd.iris.desk.attendancequeue+json',
                    resource: {
                        name: fila.name,
                        isActive: fila.isActive !== false,
                        ownerIdentity: ownerDestino,
                        Priority: fila.Priority || 0
                    }
                });

                if (data.status === 'success') {
                    criadas++;
                    addLogItem(`✅ Fila criada no destino: ${fila.name}`, 'success');
                } else {
                    addLogItem(`❌ Erro ao criar a fila "${fila.name}": ${reasonOf(data)}`, 'error');
                    showError(`Erro ao criar a fila "${fila.name}": ${reasonOf(data)}`);
                }
                await sleep(WRITE_DELAY);
            }

            addLogItem(`✅ Filas: ${criadas} criada(s), ${mantidas} já existente(s). Nenhuma fila é removida.`, 'success');
        }

        /* ---------------- Regras de atendimento ---------------- */

        // A Blip mantém dois formatos em paralelo: conditions[] (novo) e
        // property/relation/values na raiz (condição única, legado). Lê os dois.
        function attendanceRuleConditions(regra) {
            if (Array.isArray(regra.conditions) && regra.conditions.length > 0) return regra.conditions;
            if (regra.property) return [{ property: regra.property, relation: regra.relation, values: regra.values }];
            return [];
        }

        // O vínculo com a fila aqui é pelo NOME (campo team), não por id, então
        // não precisa remapear nada entre os bots.
        function attendanceRuleSignature(regra) {
            return JSON.stringify([
                normalizeName(regra.team),
                String(regra.title == null ? '' : regra.title),
                !!regra.isActive,
                String(regra.operator || 'Or'),
                canonConditions(attendanceRuleConditions(regra))
            ]);
        }

        function buildAttendanceRulePayload(regra, ownerDestino, idDestino) {
            const conditions = attendanceRuleConditions(regra).map(c => ({
                property: String(c.property || ''),
                relation: String(c.relation || ''),
                values: (Array.isArray(c.values) ? c.values : []).map(v => String(v))
            }));

            const resource = {
                // reusar o id do destino é o que transforma o set em update;
                // gerar guid novo toda rodada era o que duplicava as regras
                id: idDestino || generateGuid(),
                ownerIdentity: ownerDestino,
                isActive: !!regra.isActive,
                title: String(regra.title == null ? '' : regra.title),
                team: String(regra.team || ''),
                operator: String(regra.operator || 'Or'),
                conditions: conditions
            };

            // espelha a condição única na raiz, no formato legado
            if (conditions.length === 1) {
                resource.property = conditions[0].property;
                resource.relation = conditions[0].relation;
                resource.values = conditions[0].values;
            }
            return resource;
        }

        async function processarRegrasAtendimento(contrato, authorization, destinoContrato, destinoAuthorization) {
            const ownerOrigem = await getBotIdentity(contrato, authorization);
            const ownerDestino = await getBotIdentity(destinoContrato, destinoAuthorization);
            if (ownerOrigem === ownerDestino) {
                throw new Error('origem e destino são o mesmo bot - clonagem cancelada');
            }

            addLogItem('📥 Buscando regras de atendimento...', 'info');
            const regrasOrigem = await deskGetAll(contrato, authorization, '/rules');
            const regrasDestino = await deskGetAll(destinoContrato, destinoAuthorization, '/rules');
            addLogItem(`✅ Origem: ${regrasOrigem.length} regra(s) de atendimento | Destino: ${regrasDestino.length}`, 'info');

            // As regras apontam para a fila pelo nome, então avisa antes de
            // tentar gravar algo que a Blip vai recusar.
            const filasDestino = await deskGetAll(destinoContrato, destinoAuthorization, '/attendance-queues');
            const nomesDestino = new Set(filasDestino.map(f => normalizeName(f.name)));

            const chave = regra => normalizeName(regra.team) + '||' + normalizeName(regra.title);
            const diff = diffBySignature(regrasOrigem, regrasDestino, attendanceRuleSignature, attendanceRuleSignature);
            const plano = pairIntoUpdates(diff.criar, diff.deletar, chave, chave);

            if (regrasOrigem.length === 0 && plano.deletar.length > 0) {
                addLogItem(`⚠️ A origem não tem regras de atendimento: as ${plano.deletar.length} do destino serão removidas`, 'error');
            }
            console.log('Snapshot das regras de atendimento do destino, antes das mudanças:', JSON.stringify(regrasDestino));

            let removidas = 0, atualizadas = 0, criadas = 0;

            for (const regra of plano.deletar) {
                const data = await deskCommand(destinoContrato, destinoAuthorization, {
                    to: DESK, method: 'delete', uri: `/rules/${regra.id}`
                });
                if (data.status === 'success') {
                    removidas++;
                    addLogItem(`🗑️ Regra de atendimento removida do destino: ${regra.title}`, 'info');
                } else {
                    addLogItem(`❌ Erro ao remover a regra "${regra.title}": ${reasonOf(data)}`, 'error');
                    showError(`Erro ao remover a regra "${regra.title}": ${reasonOf(data)}`);
                }
                await sleep(WRITE_DELAY);
            }

            const gravar = async (regraOrigem, idDestino, verbo) => {
                if (!nomesDestino.has(normalizeName(regraOrigem.team))) {
                    addLogItem(`❌ Regra "${regraOrigem.title}" ignorada: a fila "${regraOrigem.team}" não existe no destino (ligue o switch Filas)`, 'error');
                    showError(`Regra "${regraOrigem.title}" -> fila "${regraOrigem.team}" não existe no destino`);
                    return false;
                }
                const data = await deskCommand(destinoContrato, destinoAuthorization, {
                    to: DESK,
                    method: 'set',
                    uri: '/rules',
                    type: 'application/vnd.iris.desk.rule+json',
                    resource: buildAttendanceRulePayload(regraOrigem, ownerDestino, idDestino)
                });
                if (data.status !== 'success') {
                    addLogItem(`❌ Erro ao ${verbo} a regra "${regraOrigem.title}": ${reasonOf(data)}`, 'error');
                    showError(`Erro ao ${verbo} a regra "${regraOrigem.title}": ${reasonOf(data)}`);
                    return false;
                }
                await sleep(WRITE_DELAY);
                return true;
            };

            for (const par of plano.atualizar) {
                if (await gravar(par.origem, par.destino.id, 'atualizar')) {
                    atualizadas++;
                    addLogItem(`📤 Regra de atendimento atualizada: ${par.origem.title}`, 'success');
                }
            }

            for (const regra of plano.criar) {
                if (await gravar(regra, '', 'criar')) {
                    criadas++;
                    addLogItem(`📤 Regra de atendimento criada: ${regra.title}`, 'success');
                }
            }

            addLogItem(`✅ Regras de atendimento: ${criadas} criada(s), ${atualizadas} atualizada(s), ${diff.iguais} já idêntica(s), ${removidas} removida(s)`, 'success');
        }

        // Função para obter variáveis de configuração do bot de origem
        async function getVariaveisConfiguracao(contrato, authorization) {
            const url = `https://${contrato}.http.msging.net/commands`;
            const guid = generateGuid();
            const requestBody = {
                "id": guid,
                "method": "get",
                "uri": "/buckets/blip_portal:builder_working_configuration"
            };
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': authorization
            };
            const response = await fetch(url, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            if (data.status !== 'success' || !data.resource) {
                addLogItem('❌ Nenhuma variável de configuração encontrada.', 'error');
                showError('Nenhuma variável de configuração encontrada.');
                return null;
            }
            addLogItem('✅ Variáveis de configuração obtidas com sucesso', 'success');
            return data.resource;
        }

        // Função para criar/setar variáveis de configuração no bot de destino
        async function setVariaveisConfiguracao(destinoContrato, destinoAuthorization, variaveis) {
            const url = `https://${destinoContrato}.http.msging.net/commands`;
            const guid = generateGuid();
            const requestBody = {
                "id": guid,
                "method": "set",
                "uri": "/buckets/blip_portal:builder_working_configuration",
                "type": "application/json",
                "resource": variaveis
            };
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': destinoAuthorization
            };
            const response = await fetch(url, {
                method: 'POST',
                headers: headers,
                body: JSON.stringify(requestBody)
            });
            const data = await response.json();
            if (data.status !== 'success') {
                addLogItem(`❌ Erro ao clonar variáveis: ${data.status}`, 'error');
                showError('Erro ao clonar variáveis: ' + data.status);
                return;
            }
            addLogItem('✅ Variáveis de configuração clonadas com sucesso', 'success');
        }

        // Função para buscar o ID do bot de origem
        let botIdTimeout;
        async function fetchBotIdInfoRealtime() {
            clearTimeout(botIdTimeout);
            const contrato = contratoInput.value.trim();
            const authorization = authorizationInput.value.trim();
            const botIdInfo = document.getElementById('botIdInfo');
            botIdInfo.textContent = '';
            if (!contrato || !authorization) return;
            botIdTimeout = setTimeout(async () => {
                try {
                    const url = `https://${contrato}.http.msging.net/commands`;
                    const guid = generateGuid();
                    const requestBody = {
                        id: guid,
                        to: 'postmaster@desk.msging.net',
                        method: 'get',
                        uri: '/replies'
                    };
                    const headers = {
                        'Content-Type': 'application/json',
                        'Authorization': authorization
                    };
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(requestBody)
                    });
                    const data = await response.json();
                    if (data.to && typeof data.to === 'string') {
                        const id = data.to.split('@')[0];
                        if (id) {
                            botIdInfo.innerHTML = `Id: <strong>${id}</strong>`;
                            return;
                        }
                    }
                    botIdInfo.textContent = '';
                } catch (e) {
                    botIdInfo.textContent = '';
                }
            }, 200);
        }
        contratoInput.addEventListener('input', fetchBotIdInfoRealtime);
        authorizationInput.addEventListener('input', fetchBotIdInfoRealtime);

        // Função para buscar o ID do bot de destino
        let destinoBotIdTimeout;
        async function fetchDestinoBotIdInfoRealtime() {
            clearTimeout(destinoBotIdTimeout);
            const contrato = destinoContratoInput.value.trim();
            const authorization = destinoAuthorizationInput.value.trim();
            const botIdInfo = document.getElementById('destinoBotIdInfo');
            botIdInfo.textContent = '';
            if (!contrato || !authorization) return;
            destinoBotIdTimeout = setTimeout(async () => {
                try {
                    const url = `https://${contrato}.http.msging.net/commands`;
                    const guid = generateGuid();
                    const requestBody = {
                        id: guid,
                        to: 'postmaster@desk.msging.net',
                        method: 'get',
                        uri: '/replies'
                    };
                    const headers = {
                        'Content-Type': 'application/json',
                        'Authorization': authorization
                    };
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: headers,
                        body: JSON.stringify(requestBody)
                    });
                    const data = await response.json();
                    if (data.to && typeof data.to === 'string') {
                        const id = data.to.split('@')[0];
                        if (id) {
                            botIdInfo.innerHTML = `Id: <strong>${id}</strong>`;
                            return;
                        }
                    }
                    botIdInfo.textContent = '';
                } catch (e) {
                    botIdInfo.textContent = '';
                }
            }, 200);
        }
        destinoContratoInput.addEventListener('input', fetchDestinoBotIdInfoRealtime);
        destinoAuthorizationInput.addEventListener('input', fetchDestinoBotIdInfoRealtime);

        // Log de inicialização
        console.log('Página Clonar Bots inicializada');
    </script>
